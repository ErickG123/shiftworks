<div class="settings-modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
  <header class="settings-modal-header">
    <h2 id="settings-modal-title" data-i18n="settings.title"></h2>
    <button type="button" id="close-settings" data-i18n="common.close"></button>
  </header>

  <section class="settings-section">
    <h3 data-i18n="settings.languageHeading"></h3>
    <label class="settings-row" for="settings-language-select">
      <span data-i18n="common.language"></span>
      <select id="settings-language-select">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="en">English</option>
      </select>
    </label>
  </section>

  <section class="settings-section">
    <h3 data-i18n="settings.shortcutsHeading"></h3>
    <p class="settings-note" data-i18n="settings.shortcutsText"></p>
  </section>
</div>
